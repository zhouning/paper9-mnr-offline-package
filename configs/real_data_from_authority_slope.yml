project:
  name: paper9-mnr-authority-slope
  description: County-scale Paper9 reproduction on authoritative MNR parcel data.

crs: EPSG:32648

data:
  dltb: data/input/DLTB_with_authority_slope.gpkg
  dem: data/input/DEM_placeholder.tif
  prepared_dir: data/working/prepared

fields:
  dlbm: DLBM
  qsdwdm: QSDWDM
  bsm: BSM

slope:
  source: field
  field: slope_mean

preparation:
  min_parcels: 3
  min_area_ha: 0.5
  max_parcels: 30
  min_parcels_per_township: 50

outputs:
  plan_dir: outputs/plan_baseline
  optimized_vector: outputs/plan_baseline/DLTB_optimized.shp

sampling:
  n_episodes: 60
  n_states: 1000
  n_actions: 50
  seed: 0

training:
  n_members: 3
  epochs: 30
  patience: 8
  lambda_rank: 5.0
  margin: 0.1
  batch_size: 256
  seed_base: 0
  torch_threads: 0
  out_subdir: tool3

planning:
  horizon: 5
  top_k: 50
  mpc_batch_size: 1024
  n_episodes: 1
  continuation: random
  scoring: reward
  threads: 0
  seed_offset: 0

reward:
  slope_weight: 4100.0
  cont_weight: 600.0
  baimu_weight: 2300.0
  baimu_bonus: 9.0
  baimu_area_penalty: 3100.0

workflow:
  force_resample_and_retrain_on_reward_change: true

