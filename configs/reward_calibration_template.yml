project:
  name: paper9-mnr-reward-calibration
  description: Template for calibrating Paper9 rewards against richer Ministry data.

crs: EPSG:32648

data:
  dltb: data/input/DLTB_with_authority_slope.gpkg
  dem: data/input/DEM_placeholder.tif
  prepared_dir: data/working/prepared_reward_calibration
  extra_layers:
    three_zones_three_lines: data/input/three_zones_three_lines.gpkg
    soil_quality: data/input/soil_quality.gpkg
    permanent_basic_farmland: data/input/permanent_basic_farmland.gpkg

fields:
  dlbm: DLBM
  qsdwdm: QSDWDM
  bsm: BSM

slope:
  source: field
  field: slope_mean

preparation:
  min_parcels: 3
  min_area_ha: 0.5
  max_parcels: 30
  min_parcels_per_township: 50

outputs:
  plan_dir: outputs/plan_reward_calibration
  optimized_vector: outputs/plan_reward_calibration/DLTB_optimized.shp

sampling:
  n_episodes: 80
  n_states: 1500
  n_actions: 60
  seed: 0

training:
  n_members: 5
  epochs: 40
  patience: 10
  lambda_rank: 5.0
  margin: 0.1
  batch_size: 256
  seed_base: 0
  torch_threads: 0
  out_subdir: tool3_calibrated

planning:
  horizon: 5
  top_k: 50
  mpc_batch_size: 1024
  n_episodes: 1
  continuation: random
  scoring: reward
  threads: 0
  seed_offset: 0
  constraints:
    cultivated_area_floor_delta_ha: 0
    baimu_area_floor_delta_ha: 0

reward:
  slope_weight: 4100.0
  cont_weight: 600.0
  baimu_weight: 2300.0
  baimu_bonus: 9.0
  baimu_area_penalty: 3100.0

reward_profiles:
  business_realism_v1:
    description: First business-facing profile; keep Paper9 terms and reserve capacity for policy/quality terms.
    requires_resample_train: true
    reward:
      slope_weight: 3600.0
      cont_weight: 900.0
      baimu_weight: 2600.0
      baimu_bonus: 12.0
      baimu_area_penalty: 3500.0
      policy_conflict_penalty: 5000.0
      soil_quality_gain_weight: 800.0

workflow:
  force_resample_and_retrain_on_reward_change: true

