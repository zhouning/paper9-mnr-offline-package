project:
  name: paper9-mnr-container-proxy
  description: Container smoke validation using proxy MNR-style inputs.

crs: EPSG:2359

data:
  dltb: data/input/DLTB_with_authority_slope.gpkg
  dem: data/input/DEM_placeholder.tif
  admin_units: data/input/admin_units.gpkg
  prepared_dir: data/working/container_mnr_proxy/prepared

fields:
  dlbm: DLBM
  qsdwdm: QSDWDM
  bsm: BSM
  admin_name: XZQMC

slope:
  source: field
  field: slope_mean

preparation:
  min_parcels: 3
  min_area_ha: 0.5
  max_parcels: 30
  min_parcels_per_township: 50

outputs:
  plan_dir: outputs/container_mnr_proxy/plan
  optimized_vector: outputs/container_mnr_proxy/plan/DLTB_optimized.shp

sampling:
  n_episodes: 3
  n_states: 20
  n_actions: 10
  seed: 0

training:
  n_members: 1
  epochs: 2
  patience: 1
  lambda_rank: 5.0
  margin: 0.1
  batch_size: 128
  seed_base: 0
  torch_threads: 0
  out_subdir: tool3_container

planning:
  horizon: 2
  top_k: 5
  mpc_batch_size: 128
  n_episodes: 1
  continuation: random
  scoring: reward
  threads: 0
  seed_offset: 0
  constraints:
    cultivated_area_floor_delta_ha: 0
    baimu_area_floor_delta_ha: 0

reward:
  slope_weight: 4100.0
  cont_weight: 600.0
  baimu_weight: 2300.0
  baimu_bonus: 9.0
  baimu_area_penalty: 3100.0

workflow:
  force_resample_and_retrain_on_reward_change: true
